    context_size: 4
    max_buffer_size: 64
    metric_waypoint_spacing: 0.24975892673356762
    pos_eps: 1.0e-3
    yaw_eps: 1.0e-3
    static_run_k: 3
    max_horizon: 64.0
    num_steps: 10
    final_only_euler: False
    noise_seed: 0
    rgb_fusion_enabled: True
    rgb_fusion_type: residual_gate
    rgb_fusion_alpha: 1.0
    rgb_fusion_zero_init: True
    rgb_fusion_gate_bias_init: 0.0
    rgb_fusion_trainable: True
  ACTIVE_LOOKAHEAD:
    enabled: True
    source: dino_cwp_nwm
    offline_topk: 5
    base_checkpoint_path: pretrained/active_lookahead/rxr_base_selection_required.pth
    base_checkpoint_sha256: set-by-launcher
    base_iteration: 0
    base_selection_manifest_sha256: set-by-launcher
    e24_joint_init_path: pretrained/active_lookahead/e24_avg3.pth
    e24_joint_init_sha256: bae7a9664000235dfc6fb66b43a8a0a38e7645b876e6a6369f732eb7bf404ed8
    e24_source_base_manifest_sha256: a2e84e88c568633a5a86d9cb2643d1b1cfe0d9b302cc4eb3a1b66dc0802f48c6
    top5_cls_lr: 1.0e-5
    top5_cls_weight_decay: 0.01
    top5_cls_gradient_clip_norm: 10.0
    top5_cls_condition_hidden_dim: 128
    top5_cls_zero_init: True
    e24_head_lr: 5.0e-6
    e24_head_weight_decay: 0.01
    e24_loss_weight: 1.0
    e24_train_delta_scale: 1.0
    e24_action_warmup_iters: 400
