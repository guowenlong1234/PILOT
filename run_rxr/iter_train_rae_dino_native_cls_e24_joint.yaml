    dino_cwp_checkpoint_path: pretrained/active_lookahead/dino_cwp_best.pt
    dino_cwp_checkpoint_sha256: 6a45291219907dd027203d224f3f8400631651a83bd01c45b1dea55d93ec0979
    dino_cwp_none_threshold: 0.3
    dino_cwp_context_strategy: fixed_initial
    dino_cwp_heading_policy: face_motion
    warm_start_checkpoint_path: ''
    warm_start_checkpoint_sha256: ''
    warm_start_expected_q0_contract: temporary_action_same_island_navmesh
    checkpoint_format_version: etpr1-rxr-native-cls-e24-joint-q0-cache-v2
    smoke_freeze_check: False
    diagnostics_enabled: True
  DEPTH_ENCODER:
    output_size: 256
  VISUAL_DIM:
    vis_hidden: 768
    directional: 128
  INSTRUCTION_ENCODER:
    bidirectional: True
    sensor_uuid: rxr_instruction
    embedding_size: 768

TASK_CONFIG:
  DATASET:
    ROLES: [guide]
    LANGUAGES: [en-US, en-IN, hi-IN, te-IN]
    SUFFIX: _90
  SIMULATOR:
    HABITAT_SIM_V0:
      ALLOW_SLIDING: True
