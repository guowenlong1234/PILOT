# Selected on 6 development scenes before examining 5 confirmation scenes.
# This config constructs the independent prediction runtime, not the trainer.
format: nwm_observed_panorama_virtual_context_v2
runtime:
  mode: world_exact_select
  encode_batch_size: 16
  prediction_batch_size: 8
  cached_views_per_frame: 12
  require_native_views: true

observation:
  context_size: 4
  cube_faces: [yaw0, yaw90, yaw180, yaw270, pitch90, pitch_minus90]
  native_world_yaws_deg: [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]
  optical_center: identical_across_views
  image_size: 224
  hfov_deg: 90
  break_history_at_teleport: true

world_model:
