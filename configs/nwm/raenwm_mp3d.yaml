# Frozen Stage-0 RAE-NWM runtime. Large assets are supplied externally.
model: CDiT-B/2
context_size: 4
image_size: 224
latent_dim: 768
head_width: 2048
head_depth: 2
head_num_heads: 16

heads:
  input_dim: 768
  output_dim: 768
  grid_size: [16, 16]
  pos_embed_type: learned_2d
  norm_eps: 1.0e-6
  activation: gelu
  token_pooler_type: query_attention
  token_pool_dim: 768
  token_num_queries: 1
  token_head_depth: 2
  token_head_num_heads: 8
  token_head_mlp_ratio: 4.0
  token_hidden_dim: 768
  token_projection_depth: 3
  token_dropout: 0.1
  confidence_pooler_type: query_attention
  confidence_pool_dim: 512
  confidence_num_queries: 1
  confidence_head_depth: 2
  confidence_head_num_heads: 8
  confidence_head_mlp_ratio: 4.0
  confidence_condition_dim: 128
  confidence_hidden_dim: 512
  confidence_classifier_depth: 2
  confidence_dropout: 0.1

transport:
  model_type: velocity
  path_type: linear
  loss_type: velocity
  time_dist_type: uniform
  time_dist_shift_disable: false
  num_steps: 10
  sampling_method: euler
  final_only_euler: false
