# Overlay on run_r2r/iter_train_rae_dino_ghost_concat_persistent.yaml.
# Both progressive overlays load the SAME new checkpoint and SHA.
MODEL:
  PROGRESSIVE:
    enabled: True
    max_future_depth: 2
    total_residual_bound: 1.0
    budget_fractions: [0.5, 0.5]
    share_depth_weights: True
    use_depth_embedding: True
    use_geometry_embedding: True
    distance_scale: 1.0
    pruning_mode: certified
    final_loss_weight: 1.0
    prefix_loss_weight: 0.2
  STAGE2_ONLINE:
    enabled: True
    gain: 1.0
    margin_threshold: -1.0
    head: ''
    head_sha256: ''
