BASE_TASK_CONFIG_PATH: run_r2r/r2r_vlnce.yaml
SIMULATOR_GPU_IDS: [0, 1]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0, 1]

TRAINER_NAME: SS-ETP-R1
ENV_NAME: R1Env

GPU_NUMBERS: 2
NUM_ENVIRONMENTS: 8
TENSORBOARD_DIR: data/logs/ghost_concat_sft/tensorboard/
CHECKPOINT_FOLDER: data/logs/ghost_concat_sft/checkpoints/
RESULTS_DIR: data/logs/ghost_concat_sft/results/
ONLY_LAST_SAVEALL: True

INFERENCE:
  SPLIT: test
  USE_CKPT_CONFIG: False
  SAMPLE: False
  CKPT_PATH: ''
  PREDICTIONS_FILE: ''
  FORMAT: r2r
  EPISODE_COUNT: -1

EVAL:
  checkpoint_order: ascending
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  EPISODE_COUNT: -1
  EPISODE_ID: None
  CKPT_PATH_DIR: ''
  fast_eval: False

IL:
  freeze_navigation_backbone: True
  load_from_ckpt: True
  is_requeue: False
  ckpt_to_load: pretrained/active_lookahead/base_iter14200.pth
  checkpoint_sync_enabled: True
  checkpoint_sync_destination: 'a6000@10.10.10.2:/home/a6000/gwl/ETP-R1/data/logs/ghost_concat_sft/checkpoints/etpr1_ghost_concat_sft'
  amp_init_scale: 16384.0
  resumable_checkpoints: True
  keep_last_train_states: 3
  keep_train_state_every_n_iters: 2000
  use_fused_adamw: True
  cudnn_benchmark: True
  log_cuda_memory: True
  gradient_accumulation_steps: 1
  iters: 2000
  log_every: 200
  lr: 1.0e-5
  batch_size: 8
  ml_weight: 1.0
  expert_policy: spl
  sample_ratio: 0.75
  decay_interval: 3000
  sample_ratio_iteration_offset: 14200
  sample_ratio_zero_threshold: 0.0
  warmup_iters: 0
  min_lr_ratio: 1.0
  max_traj_len: 15
  max_text_len: 150
  loc_noise: 0.5
  waypoint_aug: True
  ghost_aug: 0.0
  back_algo: teleport
  tryout: True

MODEL:
  task_type: r2r
  policy_name: R1Policy
  NUM_ANGLES: 12
  pretrained_path: pretrained/r2r_rxr_ce/rae_dinov2_etpnav_cls_768_eval_final_best/model_best_step_465000.pt
  fix_lang_embedding: False
  fix_pano_embedding: False
  use_depth_embedding: True
  use_sprels: True
  merge_ghost: True
  consume_ghost: True
  spatial_output: False
  RGB_ENCODER:
    type: rae_dinov2
    precision: ambient
    model_dir: pretrained/rae_dinov2_with_registers_base
    output_size: 768
    cls_residual_mlp_enabled: True
    cls_residual_mlp_hidden_dim: 768
    cls_residual_mlp_zero_init: True
  RAENWM:
    enabled: True
    emit_patch_latents: True
    predict_cls_token: True
    token_count: 257
    config_path: configs/nwm/raenwm_mp3d_fresh_cls.yaml
    checkpoint_path: pretrained/raenwm_native_cls/checkpoint_step_75000.pth.tar
    checkpoint_sha256: 38b24af13b76ba8faef367559244c3a0401e0557e7c299870c273cbee8a07064
    stat_path: pretrained/raenwm_stage0/stat.pt
    stat_sha256: 84ede66def5e6e3f25679334dc89cf63b12aacb99cbf0f5ae7ed4ad3187f7e59
    context_size: 4
    max_buffer_size: 64
    context_source: low_level_move_rgb_anchor
    panorama_context_mode: world_exact_select
    condition_source_pose: context_last
    low_level_encode_batch_size: 64
    metric_waypoint_spacing: 0.24975892673356762
    pos_eps: 1.0e-3
    yaw_eps: 1.0e-3
    static_run_k: 3
    max_horizon: 64.0
    num_steps: 10
    final_only_euler: False
    noise_seed: 0
    rgb_fusion_enabled: True
    rgb_fusion_type: ghost_concat
    ghost_concat_hidden_dim: 1536
    rgb_fusion_align_navigation_cls: False
    rgb_fusion_alpha: 1.0
    rgb_fusion_zero_init: True
    rgb_fusion_gate_bias_init: 0.0
    rgb_fusion_trainable: True
  ACTIVE_LOOKAHEAD:
    enabled: False
  DEPTH_ENCODER:
    output_size: 256
  VISUAL_DIM:
    vis_hidden: 768
    directional: 128
  INSTRUCTION_ENCODER:
    bidirectional: True

TASK_CONFIG:
  DATASET:
    SUFFIX: _90
  SIMULATOR:
    HABITAT_SIM_V0:
      ALLOW_SLIDING: True
